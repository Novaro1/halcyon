# Halcyon Discord bot. Runs anywhere Docker does (e.g. the same VPS as the proxy).
#
#   cd bot
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
#
# Secrets come from a .env file next to this one (never commit it).

services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      HALCYON_PASSPHRASE: ${HALCYON_PASSPHRASE:-}
      LINKS_URL: ${LINKS_URL:-https://novaro1.github.io/halcyon/links.json}
      # --- /byod command ---
      MEMBER_ROLE_ID: ${MEMBER_ROLE_ID:-}
      HALCYON_SERVER_IP: ${HALCYON_SERVER_IP:-}
      HALCYON_CNAME_TARGET: ${HALCYON_CNAME_TARGET:-vps-aef380a6.vps.ovh.us}
      HALCYON_DOMAINS_FILE: /data/domains.txt
      COMMUNITY_LINKS_CHANNEL_ID: ${COMMUNITY_LINKS_CHANNEL_ID:-}
      BYOD_MAX_PER_DAY: ${BYOD_MAX_PER_DAY:-3}
      # --- #status board + "Check a link" button ---
      STATUS_CHANNEL_ID: ${STATUS_CHANNEL_ID:-}
      STATUS_INTERVAL_MIN: ${STATUS_INTERVAL_MIN:-5}
      HALCYON_GATE_URL: ${HALCYON_GATE_URL:-}
      # --- status outage alerts (ops channel) ---
      STATUS_ALERT_CHANNEL_ID: ${STATUS_ALERT_CHANNEL_ID:-}
      STATUS_ALERT_ROLE_ID: ${STATUS_ALERT_ROLE_ID:-}
      STATUS_CONFIRM_THRESHOLD: ${STATUS_CONFIRM_THRESHOLD:-2}
      # --- new-link auto-announce ---
      LINKS_CHANNEL_ID: ${LINKS_CHANNEL_ID:-}
      HALCYON_ANNOUNCED_FILE: /data/state/announced-links.json
    volumes:
      # the shared allowlist Caddy reads — /byod appends to it (rw)
      - ../domains.txt:/data/domains.txt
      # persistent bot state (which links have already been announced)
      - ./state:/data/state
